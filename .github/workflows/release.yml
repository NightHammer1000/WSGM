name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Derive the version once (v1.2.3 -> 1.2.3). The tag name goes through env,
      # never spliced into script source (script-injection hardening).
      - name: Derive version from tag
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ver = $env:REF_NAME -replace '^v', ''
          "version=$ver" >> $env:GITHUB_OUTPUT

      # Keep exe metadata, manifest identity and installer name in sync with the
      # tag. Stamping the csproj covers the installer too: build.ps1 reads the
      # csproj <Version> and passes it to ISCC via /DAppVersion.
      - name: Stamp version from tag
        shell: pwsh
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          $ver = $env:VER
          (Get-Content src/WSGM/WSGM.csproj) -replace '<Version>.*</Version>', "<Version>$ver</Version>" | Set-Content src/WSGM/WSGM.csproj
          # assemblyIdentity requires four decimal numbers, so it is derived from
          # the tag's NUMERIC CORE only: a prerelease tag (v1.4.0-rc1) otherwise
          # yields "1.4.0-rc1.0", a manifest Windows refuses at process creation
          # (SxS error 14001). A tag without a numeric core fails the release.
          $core = ($ver -split '[-+]')[0]
          if ($core -notmatch '^\d+(\.\d+){0,3}$') { throw "Tag version '$ver' has no numeric core; refusing to stamp an invalid assemblyIdentity." }
          $parts = @($core.Split('.'))
          while ($parts.Count -lt 4) { $parts += '0' }
          $mver = $parts -join '.'
          (Get-Content src/WSGM/app.manifest) -replace 'assemblyIdentity version="[^"]*"', "assemblyIdentity version=`"$mver`"" | Set-Content src/WSGM/app.manifest

      # windows-latest ships VS Build Tools (NativeAOT linker) and Inno Setup 6 —
      # exactly what build.ps1 expects locally.
      - name: Build (NativeAOT publish + installer)
        shell: pwsh
        run: .\build.ps1

      # No portable artifact: the logon service must be installed (Program Files +
      # SCM registration), so a zip that can't boot game mode would only mislead.
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            publish/WSGM-Setup-*.exe
          generate_release_notes: true
