name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

# A superseded push must not keep a full Windows verify (Rust clippy + tests +
# Release build + coverage) running: cancel it and let the newest ref decide.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every first-party library, SDK, tool, and device package is commit-pinned as a
          # submodule. Recursive checkout also resolves the SDK pins inside Device Lab and the
          # built-in package.
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # verify.ps1 builds the vendored Steam Input Lease library from
      # native/SteamInput and runs its clippy/test gates, so the runner needs a
      # Rust toolchain with clippy. windows-latest ships rustup already.
      - name: Add Rust clippy component
        shell: pwsh
        run: rustup component add clippy

      # The device platform adds isolated runtime, tooling, plugin, and test projects, so a cold
      # NuGet restore is a meaningful part of the run. Keyed on the project
      # files because this repository pins versions in the csproj rather than in a
      # packages.lock.json, which is what setup-dotnet's own caching would need.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The Steam Input workspace is built by verify.ps1, so its registry,
      # checkout, target directory, and lockfile participate in the cache.
      - name: Cache Rust build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/SteamInput/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/SteamInput/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Lint, format, build, test, and collect coverage
        shell: pwsh
        run: ./eng/verify.ps1

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-and-coverage
          path: TestResults
          if-no-files-found: warn
