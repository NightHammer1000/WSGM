name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # verify.ps1 builds the vendored Steam Input Lease library from
      # native/SteamInput and runs its clippy/test gates, so the runner needs a
      # Rust toolchain with clippy. windows-latest ships rustup already.
      - name: Add Rust clippy component
        shell: pwsh
        run: rustup component add clippy

      - name: Cache Rust build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/SteamInput/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/SteamInput/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Lint, format, build, test, and collect coverage
        shell: pwsh
        run: ./eng/verify.ps1

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: TestResults
          if-no-files-found: warn
